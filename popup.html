<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    body {
      width: 600px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .file-info {
      margin-top: 10px;
      padding: 15px;
      background-color: #f0f0f0;
      border-radius: 4px;
      display: none;
    }
    .button {
      background-color: #4CAF50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #45a049;
    }
    .button-small {
      padding: 5px 10px;
      font-size: 0.9em;
    }
    .button-red {
      background-color: #f44336;
    }
    .button-red:hover {
      background-color: #da190b;
    }
    .button-blue {
      background-color: #2196F3;
    }
    .button-blue:hover {
      background-color: #0b7dda;
    }
    .button-yellow {
      background-color: #FFC107;
    }
    .button-yellow:hover {
      background-color: #FFA000;
    }
    .queue-container {
      margin-top: 20px;
      max-height: 600px;
      overflow-y: auto;
    }
    .queue-item {
      padding: 15px;
      margin-bottom: 15px;
      background-color: #f8f9fa;
      border-radius: 4px;
      border-left: 4px solid #4CAF50;
    }
    .queue-item h4 {
      margin: 0 0 10px 0;
      font-size: 1.1em;
    }
    .queue-item p {
      margin: 8px 0;
      font-size: 0.95em;
      line-height: 1.4;
    }
    .status {
      color: #666;
      font-style: italic;
    }
    .timestamp {
      color: #999;
      font-size: 0.85em;
    }
    .site-name {
      color: #0066cc;
    }
    #cvFile {
      display: none;
    }
    .analysis {
      margin-top: 15px;
      padding: 15px;
      background-color: #e8f5e9;
      border-radius: 4px;
    }
    .analysis h4 {
      color: #2e7d32;
      margin: 0 0 10px 0;
    }
    .analysis p {
      white-space: pre-line;
      line-height: 1.5;
    }
    .button-container {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .save-options {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background-color: #f5f5f5;
      border-radius: 4px;
    }
    .save-options button {
      margin-right: 10px;
    }
    /* Tab styles */
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 2px solid #e0e0e0;
    }
    
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 1.1em;
      color: #666;
    }
    
    .tab.active {
      color: #2196F3;
      border-bottom: 2px solid #2196F3;
      margin-bottom: -2px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Notification styles */
    .notification-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
    }

    .notification {
      background-color: #4CAF50;
      color: white;
      padding: 12px 24px;
      border-radius: 4px;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      animation: slideIn 0.5s ease-out forwards;
      opacity: 0;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }
      to {
        opacity: 0;
      }
    }

    /* Warning message styles */
    .warning-message {
      color: #856404;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      padding: 10px 15px;
      border-radius: 4px;
      margin-bottom: 15px;
      display: none;
    }

    .warning-message.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="notification-container" id="notificationContainer"></div>
  <div class="container">
    <h3>CV Karşılaştırma Aracı</h3>
    
    <div class="tabs">
      <button class="tab active" data-tab="queue">İnceleme Kuyruğu</button>
      <button class="tab" data-tab="favorites">Favoriler</button>
    </div>

    <div class="tab-content active" id="queueTab">
      <div id="warningMessage" class="warning-message"></div>
      <input type="file" id="cvFile" accept=".txt,.pdf">
      <button class="button" id="selectFile">CV Dosyası Seç</button>
      <div id="fileInfo" class="file-info">
        <strong>Seçili Dosya:</strong>
        <p id="fileName"></p>
      </div>
      
      <div class="queue-container" id="queueContainer">
        <h3>İnceleme Kuyruğu</h3>
        <div id="queueItems"></div>
      </div>
    </div>

    <div class="tab-content" id="favoritesTab">
      <div class="queue-container">
        <h3>Favori İlanlar</h3>
        <div id="favoriteItems"></div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
